server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Hashed build output can be cached indefinitely; index.html must not be, or
    # a returning visitor keeps loading the previous deployment.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The API and uploaded media are served through the same origin, so the
    # browser never makes a cross-origin request and no CORS preflight is needed.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass       http://api:8080;
        proxy_set_header Host $host;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Client-side routing: unknown paths are Angular routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
