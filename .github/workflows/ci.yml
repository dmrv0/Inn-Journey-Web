name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The projects target net8.0; the test host targets net10.0 so its
          # TestServer matches the System.Text.Json it runs against.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build InnJourney.sln --configuration Release

      - name: Test
        run: >-
          dotnet test tests/InnJourney.Tests/InnJourney.Tests.csproj
          --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/InnJourney.UI.Web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/InnJourney.UI.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
