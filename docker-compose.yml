name: inn-journey

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innjourney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innjourney}
      POSTGRES_DB: ${POSTGRES_DB:-inn_journey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so it never races the database on a cold start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innjourney} -d ${POSTGRES_DB:-inn_journey}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP, where the API sends
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI, where you read the mail

  api:
    build:
      context: .
      dockerfile: src/InnJourney.Services.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__PostgreSQL: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-inn_journey};Username=${POSTGRES_USER:-innjourney};Password=${POSTGRES_PASSWORD:-innjourney}
      Jwt__Issuer: ${JWT_ISSUER:-inn-journey-api}
      Jwt__Audience: ${JWT_AUDIENCE:-inn-journey-web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env - see .env.example}
      Email__Host: mailhog
      Email__Port: 1025
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:4200}
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: ${SEED_ON_STARTUP:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./src/InnJourney.UI.Web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4200}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  uploads:
